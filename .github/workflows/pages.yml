name: pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/check_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate public artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/.nojekyll
          if find site -type l -print -quit | grep -q .; then
            echo "Symbolic links are not allowed in the public Pages artifact." >&2
            exit 1
          fi
          if grep -RIEq \
            '(xox[baprs]-|gh[pousr]_[A-Za-z0-9_]+|glsa_[A-Za-z0-9_]+|/Users/[^/]+/)' \
            site; then
            echo "Potential secret or local user path found in site/." >&2
            exit 1
          fi
          unexpected_internal_repositories="$(
            grep -RIEo \
              '(musinsa|29CM-Developers)/[A-Za-z0-9_.-]+' \
              site \
              | grep -vE ':musinsa/cs-claude-marketplace$' \
              || true
          )"
          if [ -n "$unexpected_internal_repositories" ]; then
            echo "Unexpected internal repository identifier found in site/:" >&2
            printf '%s\n' "$unexpected_internal_repositories" >&2
            exit 1
          fi

      - name: Validate guide links and UI images
        run: python3 scripts/check_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
