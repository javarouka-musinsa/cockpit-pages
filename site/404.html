<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b6cf4">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>페이지를 찾을 수 없습니다 — Cockpit</title>
  <link rel="icon" href="assets/cockpit-mark.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      color: #20242b;
      background: #edf5ff;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    }
    main {
      width: min(560px, 100%);
      padding: 54px;
      border: 1px solid #cbd9eb;
      border-radius: 24px;
      background: white;
      box-shadow: 0 30px 70px rgba(26,47,75,.15);
    }
    small { color: #0b6cf4; font: 800 12px ui-monospace, monospace; }
    h1 { margin: 14px 0; font-size: clamp(36px, 8vw, 58px); line-height: 1.05; letter-spacing: -.055em; }
    p { margin: 0 0 28px; color: #59616d; line-height: 1.7; }
    a {
      display: inline-flex;
      padding: 12px 18px;
      border-radius: 11px;
      color: white;
      background: #0b6cf4;
      font-weight: 750;
      text-decoration: none;
    }
    a:focus-visible { outline: 3px solid rgba(11,108,244,.4); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <small>404 · OFF COURSE</small>
    <h1>이 경로에는<br>작업이 없습니다.</h1>
    <p>주소가 바뀌었거나 페이지가 이동했습니다. Cockpit 안내 화면에서 다시 시작하세요.</p>
    <a href="./">Cockpit 홈으로</a>
  </main>
</body>
</html>
